minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [ pre-commit, commit-msg ]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (src)
        entry: uv run ruff check src
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format check (src)
        entry: uv run ruff format --check src
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy type check (src and tests)
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        always_run: true
      - id: conventional-commit
        name: Conventional Commit message
        entry: uv run python scripts/check_commit_message.py
        language: system
        stages: [ commit-msg ]
