[project]
name = "engineering-knowledge-assistant"
version = "0.1.0"
description = "Class 1 starter project: document catalog for an engineering knowledge assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_knowledge_assistant"]

[dependency-groups]
dev = ["mypy", "pre-commit", "ruff"]
test = ["pytest", "pytest-cov"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["engineering_knowledge_assistant"]
