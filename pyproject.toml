[project]
name = "engineering-knowledge-assistant"
version = "0.2.0"
description = "Class 2 layered document service for the Engineering Knowledge Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_assistant"]

[dependency-groups]
dev = ["ipykernel", "mypy", "pre-commit", "ruff"]
test = ["httpx", "pytest", "pytest-cov"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["engineering_assistant"]
